name: opsflow
services:
  app:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://opsflow:opsflow_dev@postgres:5432/opsflow
      OPSFLOW_DATA_DIR: /data
    ports:
      - "127.0.0.1:${OPSFLOW_PORT:-18080}:8000"
    volumes:
      - opsflow_files:/data
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: opsflow
      POSTGRES_PASSWORD: opsflow_dev
      POSTGRES_DB: opsflow
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - opsflow_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "opsflow", "-d", "opsflow"]
      interval: 2s
      timeout: 3s
      retries: 15
volumes:
  opsflow_data:
  opsflow_files:
