services:
  - type: web
    name: opsflow
    runtime: docker
    plan: 0.5c-512mb
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: "off"
    healthCheckPath: /health
    disk:
      name: opsflow-documents
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: opsflow-db
          property: connectionString
      - key: OPSFLOW_DATA_DIR
        value: /data
      - key: OPSFLOW_COOKIE_SECURE
        value: "true"
      - key: OPSFLOW_JWT_SECRET
        generateValue: true
      - key: OPSFLOW_SETUP_TOKEN
        generateValue: true
      - key: PORT
        value: "8000"

databases:
  - name: opsflow-db
    plan: 0.1c-256mb
    region: frankfurt
    diskSizeGB: 1
    ipAllowList: []
